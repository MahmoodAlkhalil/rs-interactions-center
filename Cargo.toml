[package]
name = "rs-interactions-center"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.4", features = ["json", "multipart","macros"] }
serde_json = { version = "1.0.145", features = ["default"] }
sea-orm = { version = "1.1.16", features = ["serde_json", "sqlx-postgres", "runtime-tokio", "uuid"] }
tokio = { version = "1.47.1", features = ["rt-multi-thread"] }
env_logger = "0.11.8"
log = "0.4.28"
dotenv = "0.15.0"
thiserror = "2.0.16"
uuid = "1.18.1"
serde = { version = "1.0.225", features = ["derive"] }