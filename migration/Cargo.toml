[package]
name = "migration"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "migration"
path = "src/lib.rs"

[dependencies]
async-std = { version = "1", features = ["attributes", "tokio1"] }
tracing = "0.1.41"
uuid = { version = "1.18.1", features = ["v4"] }

[dependencies.sea-orm-migration]
version = "1.1.16"
features = [
    "sqlx-postgres",
   "runtime-tokio-rustls",
]
